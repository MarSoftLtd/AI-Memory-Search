<meta charset="utf-8"><style>body{font:18px Arial;margin:60px;line-height:2}h1{font-size:28px}</style><h1>Türkçe doğrulama belgesi</h1><p>Su faturası cuma günü ödenmelidir.</p><p>Kira sözleşmesi pazartesi günü imzalanır.</p><p>Çorba tarifi domates, havuç ve fesleğen içerir.</p><p>Tıbbi not dinlenme ve bol su önerir.</p><p>Kutsal Kitap ayeti: Rab benim çobanımdır.</p><p>Proje toplantısı salı günü saat onda başlar.</p>
