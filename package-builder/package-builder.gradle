import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.time.Instant
import java.time.LocalDateTime
import java.time.ZoneOffset
import java.util.zip.CRC32
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

def packageSourcesDirectory =
        file("${rootDir}/package-builder/sources")
def packageOutputDirectory =
        file("${rootDir}/build/packages")

def payloadFileNames = [
        "config.json",
        "model.bin",
        "source.spm",
        "target.spm",
        "shared_vocabulary.json"
]
def checksumOrder = payloadFileNames.toSorted()
def archiveEntryOrder = [
        "manifest.json",
        "config.json",
        "model.bin",
        "source.spm",
        "target.spm",
        "shared_vocabulary.json",
        "checksum.sha256"
]
def manifestPropertyNames = [
        "packageId",
        "displayName",
        "packageType",
        "languageFamily",
        "supportedLanguages",
        "packageFormatVersion",
        "modelVersion",
        "translatorEngine",
        "tokenizer",
        "version",
        "minimumAppVersion",
        "runtime",
        "architecture",
        "createdBy"
]
def generatedManifestFields = [
        "buildDate",
        "checksum",
        "compressedSize",
        "uncompressedSize"
]
def manifestFieldOrder = [
        "packageId",
        "displayName",
        "packageType",
        "languageFamily",
        "supportedLanguages",
        "packageFormatVersion",
        "modelVersion",
        "translatorEngine",
        "tokenizer",
        "version",
        "minimumAppVersion",
        "runtime",
        "architecture",
        "createdBy",
        "buildDate",
        "checksum",
        "compressedSize",
        "uncompressedSize"
]
def packagePropertyNames =
        (["archiveBaseName"] + manifestPropertyNames) as Set

def hex = { byte[] digest ->
    digest.collect { String.format("%02x", it & 0xff) }.join()
}

def sha256Bytes = { byte[] bytes ->
    hex(MessageDigest.getInstance("SHA-256").digest(bytes))
}

def sha256File = { File source ->
    MessageDigest digest = MessageDigest.getInstance("SHA-256")
    source.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    hex(digest.digest())
}

def normalizedJsonBytes = { Map<String, Object> value ->
    String json = JsonOutput.prettyPrint(JsonOutput.toJson(value))
            .replace("\r\n", "\n")
            .replace("\r", "\n") + "\n"
    json.getBytes(StandardCharsets.UTF_8)
}

def loadPackageDefinition = { File sourceDirectory ->
    File propertiesFile = new File(sourceDirectory, "package.properties")
    if (!propertiesFile.isFile()) {
        throw new GradleException(
                "Package metadata is missing: ${propertiesFile}"
        )
    }

    Properties properties = new Properties()
    propertiesFile.withReader("UTF-8") { reader ->
        properties.load(reader)
    }
    if (properties.stringPropertyNames() as Set != packagePropertyNames) {
        throw new GradleException(
                "Package metadata fields are invalid: ${propertiesFile}"
        )
    }

    packagePropertyNames.each { String name ->
        String value = properties.getProperty(name)
        if (value == null || value.trim().isEmpty()) {
            throw new GradleException(
                    "Package metadata field is missing: ${name}"
            )
        }
    }

    List<String> supportedLanguages = properties
            .getProperty("supportedLanguages")
            .split(",")
            .collect { it.trim() }
    if (supportedLanguages.isEmpty() || supportedLanguages.any { it.isEmpty() }) {
        throw new GradleException("supportedLanguages is invalid")
    }

    int packageFormatVersion
    try {
        packageFormatVersion = Integer.parseInt(
                properties.getProperty("packageFormatVersion").trim()
        )
    } catch (NumberFormatException failure) {
        throw new GradleException("packageFormatVersion is invalid", failure)
    }
    if (packageFormatVersion < 1) {
        throw new GradleException("packageFormatVersion must be positive")
    }

    String archiveBaseName = properties.getProperty("archiveBaseName").trim()
    String version = properties.getProperty("version").trim()
    if (!(archiveBaseName ==~ /[a-z0-9][a-z0-9.-]*/) ||
            !(version ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
        throw new GradleException(
                "archiveBaseName or version is invalid: ${sourceDirectory.name}"
        )
    }

    LinkedHashMap<String, Object> manifestValues = new LinkedHashMap<>()
    manifestPropertyNames.each { String name ->
        if (name == "supportedLanguages") {
            manifestValues[name] = supportedLanguages
        } else if (name == "packageFormatVersion") {
            manifestValues[name] = packageFormatVersion
        } else {
            manifestValues[name] = properties.getProperty(name).trim()
        }
    }

    String outputBaseName = "${archiveBaseName}-${version}"
    [
            key                 : sourceDirectory.name,
            sourceDirectory     : sourceDirectory,
            payloadDirectory    : new File(sourceDirectory, "payload"),
            propertiesFile      : propertiesFile,
            archiveBaseName     : archiveBaseName,
            outputBaseName      : outputBaseName,
            archiveFileName     : "${outputBaseName}.aipackage",
            checksumFileName    : "${outputBaseName}.aipackage.sha256",
            packageFile         : new File(
                    packageOutputDirectory,
                    "${outputBaseName}.aipackage"
            ),
            packageChecksumFile : new File(
                    packageOutputDirectory,
                    "${outputBaseName}.aipackage.sha256"
            ),
            manifestValues      : manifestValues
    ]
}

def discoverPackageDefinitions = {
    if (!packageSourcesDirectory.isDirectory()) {
        throw new GradleException(
                "Package sources directory is missing: ${packageSourcesDirectory}"
        )
    }

    List<File> directories = packageSourcesDirectory.listFiles()
            ?.findAll { it.isDirectory() }
            ?.sort { left, right -> left.name <=> right.name } ?: []
    if (directories.isEmpty()) {
        throw new GradleException(
                "No AI package sources found under ${packageSourcesDirectory}"
        )
    }
    directories.collect { loadPackageDefinition(it) }
}

def selectPackageDefinition = { List<Map> definitions ->
    String selector = project.findProperty("aiPackage")?.toString()?.trim()
    if (selector == null || selector.isEmpty()) {
        if (definitions.size() != 1) {
            throw new GradleException(
                    "Select one package with -PaiPackage=<directory|archiveBaseName|packageId>"
            )
        }
        return definitions.first()
    }

    List<Map> matches = definitions.findAll { Map definition ->
        definition.key == selector ||
                definition.archiveBaseName == selector ||
                definition.manifestValues.packageId == selector
    }
    if (matches.size() != 1) {
        throw new GradleException(
                "AI package selector did not match exactly one package: ${selector}"
        )
    }
    matches.first()
}

def validateSourcePayload = { Map definition ->
    File payloadDirectory = definition.payloadDirectory
    if (!payloadDirectory.isDirectory()) {
        throw new GradleException(
                "Canonical payload directory is missing: ${payloadDirectory}"
        )
    }

    List<File> actualFiles = payloadDirectory.listFiles()?.toList() ?: []
    if (actualFiles.any { it.isDirectory() || Files.isSymbolicLink(it.toPath()) }) {
        throw new GradleException(
                "Canonical payload may contain regular files only: ${definition.key}"
        )
    }
    List<String> actualNames = actualFiles.collect { it.name }.toSorted()
    if (actualNames != payloadFileNames.toSorted()) {
        throw new GradleException(
                "Canonical payload entries are invalid for ${definition.key}: ${actualNames}"
        )
    }
    payloadFileNames.each { String name ->
        File source = new File(payloadDirectory, name)
        if (!source.isFile() || source.length() == 0L) {
            throw new GradleException(
                    "Canonical payload file is missing or empty: ${name}"
            )
        }
    }
}

def checksumDocumentBytes = { Map definition ->
    File payloadDirectory = definition.payloadDirectory
    String document = checksumOrder.collect { String name ->
        "${sha256File(new File(payloadDirectory, name))}  ${name}"
    }.join("\n") + "\n"
    document.getBytes(StandardCharsets.UTF_8)
}

def createManifest = {
    Map definition,
    String buildDate,
    String checksum,
    compressedSize,
    uncompressedSize ->

    LinkedHashMap<String, Object> manifest = new LinkedHashMap<>()
    manifestFieldOrder.each { String field ->
        switch (field) {
            case "buildDate":
                manifest[field] = buildDate
                break
            case "checksum":
                manifest[field] = checksum
                break
            case "compressedSize":
                manifest[field] = compressedSize
                break
            case "uncompressedSize":
                manifest[field] = uncompressedSize
                break
            default:
                manifest[field] = definition.manifestValues[field]
        }
    }
    manifest
}

def addZipBytes = {
    ZipOutputStream output,
    String name,
    byte[] bytes,
    LocalDateTime timestamp,
    boolean stored ->

    ZipEntry entry = new ZipEntry(name)
    entry.setTimeLocal(timestamp)
    if (stored) {
        CRC32 crc = new CRC32()
        crc.update(bytes)
        entry.method = ZipEntry.STORED
        entry.size = bytes.length
        entry.compressedSize = bytes.length
        entry.crc = crc.value
    }
    output.putNextEntry(entry)
    output.write(bytes)
    output.closeEntry()
}

def addZipFile = {
    ZipOutputStream output,
    String name,
    File source,
    LocalDateTime timestamp ->

    ZipEntry entry = new ZipEntry(name)
    entry.setTimeLocal(timestamp)
    output.putNextEntry(entry)
    source.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = input.read(buffer)) != -1) {
            output.write(buffer, 0, read)
        }
    }
    output.closeEntry()
}

def writeArchive = {
    Map definition,
    File target,
    byte[] manifestBytes,
    byte[] checksumBytes,
    LocalDateTime timestamp ->

    File payloadDirectory = definition.payloadDirectory
    target.parentFile.mkdirs()
    target.withOutputStream { fileOutput ->
        ZipOutputStream zipOutput = new ZipOutputStream(fileOutput)
        zipOutput.setLevel(9)
        try {
            archiveEntryOrder.each { String name ->
                if (name == "manifest.json") {
                    addZipBytes(zipOutput, name, manifestBytes, timestamp, true)
                } else if (name == "checksum.sha256") {
                    addZipBytes(zipOutput, name, checksumBytes, timestamp, true)
                } else {
                    addZipFile(
                            zipOutput,
                            name,
                            new File(payloadDirectory, name),
                            timestamp
                    )
                }
            }
        } finally {
            zipOutput.close()
        }
    }
}

def readZipEntryBytes = { ZipFile archive, String name ->
    ZipEntry entry = archive.getEntry(name)
    if (entry == null) {
        throw new GradleException("Archive entry is missing: ${name}")
    }
    archive.getInputStream(entry).withCloseable { it.bytes }
}

def extractArchive = { File archiveFile, File targetDirectory ->
    if (targetDirectory.exists()) {
        targetDirectory.deleteDir()
    }
    targetDirectory.mkdirs()
    String canonicalRoot = targetDirectory.canonicalPath + File.separator

    new ZipFile(archiveFile, StandardCharsets.UTF_8).withCloseable { ZipFile archive ->
        archive.entries().each { ZipEntry entry ->
            File target = new File(targetDirectory, entry.name)
            if (!target.canonicalPath.startsWith(canonicalRoot)) {
                throw new GradleException(
                        "Archive entry escapes validation directory: ${entry.name}"
                )
            }
            target.withOutputStream { output ->
                archive.getInputStream(entry).withCloseable { input ->
                    input.transferTo(output)
                }
            }
        }
    }
}

def invokeTranslationPackageValidator = { File extractedDirectory ->
    def compileTask = project(":app").tasks.getByName(
            "compileDebugJavaWithJavac"
    )
    File classesDirectory = compileTask.destinationDirectory.get().asFile
    URLClassLoader loader = new URLClassLoader(
            [classesDirectory.toURI().toURL()] as URL[],
            this.class.classLoader
    )
    try {
        Class<?> layoutClass = loader.loadClass(
                "com.bliss.aimemorysearch.ai.TranslationPackageLayout"
        )
        Class<?> validatorClass = loader.loadClass(
                "com.bliss.aimemorysearch.ai.TranslationPackageValidator"
        )
        Object layout = layoutClass.getConstructor(File).newInstance(
                extractedDirectory
        )
        Object validator = validatorClass.getConstructor().newInstance()
        boolean valid = validatorClass
                .getMethod("isValid", layoutClass)
                .invoke(validator, layout) as boolean
        if (!valid) {
            throw new GradleException("TranslationPackageValidator rejected package")
        }
    } finally {
        loader.close()
    }
}

def validateArchive = {
    Map definition,
    File archiveFile,
    File extractionDirectory,
    String expectedBuildDate ->

    if (!archiveFile.isFile() || archiveFile.length() == 0L) {
        throw new GradleException("Package archive is missing or empty")
    }

    Map manifest
    byte[] checksumBytes
    new ZipFile(archiveFile, StandardCharsets.UTF_8).withCloseable { ZipFile archive ->
        List<? extends ZipEntry> entries = archive.entries().toList()
        List<String> names = entries.collect { it.name }
        if (names != archiveEntryOrder) {
            throw new GradleException(
                    "Archive entry order or contents are invalid: ${names}"
            )
        }
        if (entries.any { it.directory || it.name.contains("/") || it.name.contains("\\") }) {
            throw new GradleException("Archive must contain root files only")
        }

        manifest = new JsonSlurper().parse(
                archive.getInputStream(archive.getEntry("manifest.json")),
                "UTF-8"
        ) as Map
        if (manifest.keySet().toList() != manifestFieldOrder) {
            throw new GradleException("Generated manifest fields or order are invalid")
        }
        manifestPropertyNames.each { String field ->
            if (manifest[field] != definition.manifestValues[field]) {
                throw new GradleException(
                        "Generated manifest is inconsistent: ${field}"
                )
            }
        }
        if (manifest.buildDate != expectedBuildDate) {
            throw new GradleException("Generated buildDate is inconsistent")
        }
        if ((manifest.compressedSize as long) != archiveFile.length()) {
            throw new GradleException("Manifest compressedSize is inconsistent")
        }
        long actualUncompressedSize = entries.sum { it.size as long } as long
        if ((manifest.uncompressedSize as long) != actualUncompressedSize) {
            throw new GradleException("Manifest uncompressedSize is inconsistent")
        }

        checksumBytes = readZipEntryBytes(archive, "checksum.sha256")
        if (manifest.checksum != sha256Bytes(checksumBytes)) {
            throw new GradleException("Manifest checksum is inconsistent")
        }
    }

    extractArchive(archiveFile, extractionDirectory)
    invokeTranslationPackageValidator(extractionDirectory)

    String expectedChecksumDocument = checksumOrder.collect { String name ->
        "${sha256File(new File(extractionDirectory, name))}  ${name}"
    }.join("\n") + "\n"
    String actualChecksumDocument = new String(
            checksumBytes,
            StandardCharsets.UTF_8
    )
    if (actualChecksumDocument != expectedChecksumDocument) {
        throw new GradleException("Payload checksum verification failed")
    }
}

def sourceDate = {
    String sourceDateEpoch = System.getenv("SOURCE_DATE_EPOCH")
    if (sourceDateEpoch == null || !(sourceDateEpoch ==~ /\d+/)) {
        throw new GradleException(
                "SOURCE_DATE_EPOCH must contain non-negative epoch seconds"
        )
    }
    Instant instant = Instant.ofEpochSecond(Long.parseLong(sourceDateEpoch))
    LocalDateTime timestamp = LocalDateTime.ofInstant(instant, ZoneOffset.UTC)
    if (timestamp.year < 1980) {
        throw new GradleException(
                "SOURCE_DATE_EPOCH must be on or after 1980-01-01"
        )
    }
    [instant: instant, buildDate: instant.toString(), zipTimestamp: timestamp]
}

def validatePublishedPackage = {
    Map definition,
    File validationDirectory,
    String buildDate ->

    File packageFile = definition.packageFile
    File checksumFile = definition.packageChecksumFile
    validateArchive(definition, packageFile, validationDirectory, buildDate)

    String expected =
            "${sha256File(packageFile)}  ${definition.archiveFileName}\n"
    String actual = checksumFile.getText("UTF-8")
            .replace("\r\n", "\n")
            .replace("\r", "\n")
    if (actual != expected) {
        throw new GradleException(
                "Production package SHA-256 sidecar is inconsistent"
        )
    }
}

def buildPackage = {
    Map definition,
    File taskTemporaryDirectory,
    Map date ->

    String stage = "initialization"
    File workDirectory = new File(
            taskTemporaryDirectory,
            definition.outputBaseName
    )
    File candidatePackage = new File(
            workDirectory,
            "${definition.archiveFileName}.partial"
    )
    File validationDirectory = new File(workDirectory, "validation")
    File candidateChecksum = new File(
            workDirectory,
            "${definition.checksumFileName}.partial"
    )
    File packageFile = definition.packageFile
    File packageChecksumFile = definition.packageChecksumFile

    try {
        if (packageFile.exists() || packageChecksumFile.exists()) {
            if (!packageFile.isFile() || !packageChecksumFile.isFile()) {
                throw new GradleException(
                        "A partial production output already exists"
                )
            }
            stage = "existing production output validation"
            validatePublishedPackage(
                    definition,
                    validationDirectory,
                    date.buildDate
            )
            return
        }

        stage = "source validation"
        validateSourcePayload(definition)

        stage = "checksum generation"
        byte[] checksumBytes = checksumDocumentBytes(definition)
        String manifestChecksum = sha256Bytes(checksumBytes)

        stage = "deterministic package creation"
        workDirectory.mkdirs()
        long compressedSize = 0L
        long uncompressedSize = 0L
        boolean stabilized = false
        for (int attempt = 0; attempt < 10; attempt++) {
            Map manifest = createManifest(
                    definition,
                    date.buildDate,
                    manifestChecksum,
                    compressedSize,
                    uncompressedSize
            )
            byte[] manifestBytes = normalizedJsonBytes(manifest)
            long nextUncompressedSize = manifestBytes.length + checksumBytes.length
            payloadFileNames.each { String name ->
                nextUncompressedSize += new File(
                        definition.payloadDirectory,
                        name
                ).length()
            }
            writeArchive(
                    definition,
                    candidatePackage,
                    manifestBytes,
                    checksumBytes,
                    date.zipTimestamp
            )
            long nextCompressedSize = candidatePackage.length()
            if (nextCompressedSize == compressedSize &&
                    nextUncompressedSize == uncompressedSize) {
                stabilized = true
                break
            }
            compressedSize = nextCompressedSize
            uncompressedSize = nextUncompressedSize
        }
        if (!stabilized) {
            throw new GradleException("Package size fields did not stabilize")
        }

        stage = "candidate validation"
        validateArchive(
                definition,
                candidatePackage,
                validationDirectory,
                date.buildDate
        )

        stage = "archive SHA-256 generation"
        String archiveChecksum = sha256File(candidatePackage)
        candidateChecksum.setText(
                "${archiveChecksum}  ${definition.archiveFileName}\n",
                "UTF-8"
        )

        stage = "atomic publication"
        packageOutputDirectory.mkdirs()
        Files.move(
                candidateChecksum.toPath(),
                packageChecksumFile.toPath(),
                StandardCopyOption.ATOMIC_MOVE
        )
        try {
            Files.move(
                    candidatePackage.toPath(),
                    packageFile.toPath(),
                    StandardCopyOption.ATOMIC_MOVE
            )
        } catch (Exception publicationFailure) {
            packageChecksumFile.delete()
            throw publicationFailure
        }
    } catch (Exception failure) {
        candidatePackage.delete()
        candidateChecksum.delete()
        validationDirectory.deleteDir()
        throw new GradleException(
                "AI package '${definition.key}' failed at ${stage}: ${failure.message}",
                failure
        )
    } finally {
        validationDirectory.deleteDir()
    }
}

def validatePackage = {
    Map definition,
    File taskTemporaryDirectory,
    Map date ->

    String stage = "production package validation"
    File validationDirectory = new File(
            taskTemporaryDirectory,
            "${definition.outputBaseName}-validation"
    )
    try {
        validatePublishedPackage(
                definition,
                validationDirectory,
                date.buildDate
        )
    } catch (Exception failure) {
        throw new GradleException(
                "AI package '${definition.key}' validation failed at ${stage}: ${failure.message}",
                failure
        )
    } finally {
        validationDirectory.deleteDir()
    }
}

def configurePackageTaskInputs = { Task task ->
    task.inputs.dir(packageSourcesDirectory)
    task.inputs.property(
            "sourceDateEpoch",
            providers.environmentVariable("SOURCE_DATE_EPOCH")
    )
}

tasks.register("buildAiPackage") {
    group = "AI package"
    description = "Builds one discovered production AI package."
    dependsOn(":app:compileDebugJavaWithJavac")
    configurePackageTaskInputs(delegate as Task)
    outputs.dir(packageOutputDirectory)

    doLast {
        List<Map> definitions = discoverPackageDefinitions()
        buildPackage(
                selectPackageDefinition(definitions),
                temporaryDir,
                sourceDate()
        )
    }
}

tasks.register("validateAiPackage") {
    group = "verification"
    description = "Validates one discovered production AI package."
    dependsOn("buildAiPackage")
    configurePackageTaskInputs(delegate as Task)

    doLast {
        List<Map> definitions = discoverPackageDefinitions()
        validatePackage(
                selectPackageDefinition(definitions),
                temporaryDir,
                sourceDate()
        )
    }
}

tasks.register("buildAllAiPackages") {
    group = "AI package"
    description = "Builds every discovered production AI package."
    dependsOn(":app:compileDebugJavaWithJavac")
    configurePackageTaskInputs(delegate as Task)
    outputs.dir(packageOutputDirectory)

    doLast {
        Map date = sourceDate()
        discoverPackageDefinitions().each { Map definition ->
            buildPackage(definition, temporaryDir, date)
        }
    }
}

tasks.register("validateAllAiPackages") {
    group = "verification"
    description = "Validates every discovered production AI package."
    dependsOn("buildAllAiPackages")
    configurePackageTaskInputs(delegate as Task)

    doLast {
        Map date = sourceDate()
        discoverPackageDefinitions().each { Map definition ->
            validatePackage(definition, temporaryDir, date)
        }
    }
}
